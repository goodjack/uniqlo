    大身: 53% 棉, 30% 聚酯纖維( 再生聚酯纖維 ), 17% 聚酯纖維/ 羅紋部分: 73% 棉, 27% 聚酯纖維<br>

    <strong>洗滌方式</strong><br>
    洗衣機（水溫40度）, 乾洗, 不可烘乾。<br>
    深色衣物請勿與其他衣物一同洗滌。<br>
    淺色衣服請勿使用含有螢光增白劑的洗劑。<br>
    請勿長時間浸泡在水中。<br>
    請整形後晾乾。<br>
    熨燙時請加墊布。<br>
    本商品會在流汗或淋雨弄濕時，或因摩擦而染色到其他衣物上，敬請注意。<br>
    請勿使用柔軟精。
